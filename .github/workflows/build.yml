name: Build Telegram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Clone Telegram Android
        run: |
          git clone --depth 1 https://github.com/DrKLO/Telegram.git telegram-src
          
      - name: Apply Modified CameraView
        run: |
          cp CameraView.java telegram-src/TMessagesProj/src/main/java/org/telegram/messenger/camera/CameraView.java
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x telegram-src/gradlew

      - name: Build with Gradle
        run: |
          cd telegram-src
          # Create local.properties with a dummy API ID for building
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Note: Official Telegram requires API_ID and API_HASH. 
          # For testing, we might need to skip signing or use a debug build.
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-vcam-debug
          path: telegram-src/TMessagesProj/build/outputs/apk/debug/*.apk
